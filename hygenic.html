<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Food Hygiene Verification - Foodlink Rescue</title>

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- LINKING CUSTOM CSS FILE HERE -->
  <link rel="stylesheet" href="hygenic.css">
</head>
<body class="bg-slate-50 text-slate-800 antialiased font-sans">

  <!-- Header / Navigation -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="index.html" class="text-slate-500 hover:text-slate-800 transition mr-1" title="Back to Home">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </a>
        <div class="bg-emerald-600 text-white p-2 rounded-xl">
          <i class="fa-solid fa-shield-halved text-xl"></i>
        </div>
        <div>
          <h1 class="font-bold text-lg text-slate-900 leading-tight">Foodlink Rescue</h1>
          <p class="text-xs text-slate-500">Food Hygiene Verification Engine</p>
        </div>
      </div>

      <div class="flex items-center gap-4">
        <div class="hidden md:flex items-center gap-2 text-xs text-slate-600 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200">
          <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
          FDA & FSSAI 2-Hour Rule Enforced
        </div>
        <button id="openGuideBtn" class="text-xs font-semibold text-emerald-700 bg-emerald-50 border border-emerald-200 hover:bg-emerald-100 px-3 py-2 rounded-lg transition flex items-center gap-1.5">
          <i class="fa-solid fa-book-open"></i> Safety Guidelines
        </button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-4 py-8 grid grid-cols-1 lg:grid-cols-12 gap-8">
    
    <!-- Left Column: Interactive Inspection Form -->
    <section class="lg:col-span-5">
      <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-6 sticky top-24">
        <div class="flex items-center justify-between mb-4 pb-3 border-b border-slate-100">
          <h2 class="font-bold text-slate-900 text-base flex items-center gap-2">
            <i class="fa-solid fa-clipboard-check text-emerald-600"></i>
            Food Safety Verification Form
          </h2>
          <span class="text-xs font-semibold text-slate-400">Step <span id="currentStepText">1</span> of 3</span>
        </div>

        <form id="hygieneForm">
          
          <!-- STEP 1: Basic Information -->
          <div id="step1" class="space-y-4">
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Food Item Name *</label>
              <input type="text" id="foodName" required placeholder="e.g. Rice & Vegetable Curry" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Donor Name / Business *</label>
              <input type="text" id="donorName" required placeholder="e.g. Sunrise Cafe" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div class="grid grid-cols-2 gap-3">
              <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Food Category</label>
                <select id="foodCategory" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                  <option value="Cooked Meal">Cooked Meal</option>
                  <option value="Baked Goods">Baked Goods</option>
                  <option value="Fresh Produce">Fresh Produce</option>
                  <option value="Dairy/Packaged">Dairy / Packaged</option>
                </select>
              </div>

              <div>
                <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Portions (Count)</label>
                <input type="number" id="portionCount" value="10" min="1" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
              </div>
            </div>

            <button type="button" id="toStep2Btn" class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-xl text-sm transition mt-2 flex items-center justify-center gap-2">
              Next: Time & Temperature <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
          </div>

          <!-- STEP 2: Time & Temperature Checks -->
          <div id="step2" class="space-y-4 hidden">
            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Preparation / Cooked Time *</label>
              <input type="datetime-local" id="cookedTime" required class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-bold uppercase text-slate-600 mb-1">Storage Condition *</label>
              <select id="storageType" class="w-full px-3 py-2 text-sm border border-slate-300 rounded-lg focus:ring-2 focus:ring-emerald-500 focus:outline-none">
                <option value="Hot Holding">Hot Holding (Steam Table / Warmer)</option>
                <option value="Refrigerated">Refrigerated Storage (&lt;5°C)</option
